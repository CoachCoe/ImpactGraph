[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "impactgraph-api"
version = "0.1.0"
requires-python = ">=3.12"
description = "Transparency API for the ImpactGraph verifiable-impact proof of concept"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "argon2-cffi>=23.1,<26",
  "python-multipart>=0.0.20,<1",
  "web3>=7.7,<8",
  "structlog>=25.1,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.hatch.build.targets.wheel]
packages = ["impactgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

