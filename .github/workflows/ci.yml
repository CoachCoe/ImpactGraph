name: CI
on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check && forge test
        working-directory: contracts
  api:
    runs-on: ubuntu-latest
    # The migrations are written for PostgreSQL and the suite runs on SQLite, so the two
    # can diverge unnoticed. One test migrates a throwaway database here and checks the
    # schema it builds is the one the models describe.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: drift
          POSTGRES_PASSWORD: drift
          POSTGRES_DB: drift
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U drift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://drift:drift@localhost:5432/drift
    steps:
      - uses: actions/checkout@v4
      # The suite checks that every event the chain adapter decodes is one the compiled
      # contract declares. Without the artifact that check can only skip, and the drift it
      # exists to catch would reach a deployment before anything noticed.
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
        working-directory: contracts
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e '.[dev]'
        working-directory: apps/api
      - run: ruff check impactgraph tests && pytest -q
        working-directory: apps/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        working-directory: apps/web
      - run: npm test -- --run && npm run typecheck && npm run build
        working-directory: apps/web

