name: dad

# Application and database files are Compose interpolation inputs only.
# Each process receives an explicit capability allowlist, including its own database URL.
x-donor: &donor
  image: ${IMAGE_PREFIX:-dad}/api:${IMAGE_TAG:?set IMAGE_TAG}
  build:
    context: .
    dockerfile: apps/donor-api/Dockerfile
  depends_on:
    postgres:
      condition: service_healthy
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

x-mail-queue: &mail-queue
  DONOR_SMTP_HOST: ${DONOR_SMTP_HOST-}
  DONOR_SMTP_PORT: ${DONOR_SMTP_PORT:-587}
  DONOR_EMAIL_FROM: ${DONOR_EMAIL_FROM-}
  DONOR_EMAIL_ENCRYPTION_KEY: ${DONOR_EMAIL_ENCRYPTION_KEY-}

x-mail-transport: &mail-transport
  <<: *mail-queue
  DONOR_SMTP_USERNAME: ${DONOR_SMTP_USERNAME-}
  DONOR_SMTP_PASSWORD: ${DONOR_SMTP_PASSWORD-}
  DONOR_SMTP_CA: ${DONOR_SMTP_CA-}

x-worker-environment: &worker-environment
  DONOR_GO_WORKERS_ENABLED: ${DONOR_GO_WORKERS_ENABLED:-false}

x-push-delivery: &push-delivery
  DONOR_PUSH_APNS_KEY_FILE: ${DONOR_PUSH_APNS_KEY_FILE-}
  DONOR_PUSH_APNS_KEY_ID: ${DONOR_PUSH_APNS_KEY_ID-}
  DONOR_PUSH_APNS_TEAM_ID: ${DONOR_PUSH_APNS_TEAM_ID-}
  DONOR_PUSH_APNS_TOPIC: ${DONOR_PUSH_APNS_TOPIC-}
  DONOR_PUSH_FCM_KEY_FILE: ${DONOR_PUSH_FCM_KEY_FILE-}

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dad}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    <<: *donor
    environment:
      <<: *mail-queue
      DONOR_PUBLIC_ORIGIN: ${DONOR_PUBLIC_ORIGIN:?set DONOR_PUBLIC_ORIGIN}
      DONOR_NATIVE_RETURN_ORIGIN: ${DONOR_NATIVE_RETURN_ORIGIN-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET-}
      DONOR_STRIPE_REQUESTS_PER_SECOND: ${DONOR_STRIPE_REQUESTS_PER_SECOND:-25}
      DONOR_CONTENT_ENCRYPTION_KEY: ${DONOR_CONTENT_ENCRYPTION_KEY-}
      DONOR_EVENT_CHECKIN_SECRET: ${DONOR_EVENT_CHECKIN_SECRET-}
      DONOR_FOUNDING_CLAIM_KEY: ${DONOR_FOUNDING_CLAIM_KEY-}
      DONOR_SUPPORT_EMAIL: ${DONOR_SUPPORT_EMAIL-}
      DONOR_SMS_PROVIDER: ${DONOR_SMS_PROVIDER-}
      DONOR_SMS_ACCOUNT_ID: ${DONOR_SMS_ACCOUNT_ID-}
      DONOR_SMS_AUTH_TOKEN: ${DONOR_SMS_AUTH_TOKEN-}
      DONOR_SMS_FROM: ${DONOR_SMS_FROM-}
      DONOR_OIDC_MODE: ${DONOR_OIDC_MODE-}
      DONOR_OIDC_APPLE_CLIENT_ID: ${DONOR_OIDC_APPLE_CLIENT_ID-}
      DONOR_OIDC_GOOGLE_CLIENT_ID: ${DONOR_OIDC_GOOGLE_CLIENT_ID-}
      DONOR_OIDC_STUB_KEY: ${DONOR_OIDC_STUB_KEY-}
      DONOR_ALLOW_SIGN_IN_STUBS: ${DONOR_ALLOW_SIGN_IN_STUBS:-false}
      DONOR_WALLET_APPLE_CERT_FILE: ${DONOR_WALLET_APPLE_CERT_FILE-}
      DONOR_WALLET_APPLE_KEY_FILE: ${DONOR_WALLET_APPLE_KEY_FILE-}
      DONOR_WALLET_APPLE_WWDR_FILE: ${DONOR_WALLET_APPLE_WWDR_FILE-}
      DONOR_WALLET_GOOGLE_KEY_FILE: ${DONOR_WALLET_GOOGLE_KEY_FILE-}
      DONOR_WALLET_GOOGLE_CLASS_ID: ${DONOR_WALLET_GOOGLE_CLASS_ID-}
      DONOR_PUSH_PLATFORMS: ${DONOR_PUSH_PLATFORMS:-${DONOR_PUSH_APNS_KEY_FILE:+IOS}${DONOR_PUSH_FCM_KEY_FILE:+,ANDROID}}
      DONOR_GO_LISTEN: 0.0.0.0:8002
      # Only the web proxies, which alone share the app network with the API, may supply
      # X-Real-IP; they strip any client-sent copy.
      DONOR_TRUSTED_PROXY_CIDRS: 172.30.43.0/24
      DONOR_STAFF_ORIGIN: ${DONOR_STAFF_ORIGIN:?set DONOR_STAFF_ORIGIN}
      DONOR_API_DATABASE_URL: ${DONOR_API_DATABASE_URL:?set DONOR_API_DATABASE_URL}
    # Wallet signing keys stay outside the image. Mount them read-only
    # (files readable by uid 10001) and set DONOR_WALLET_*_FILE and DONOR_PUSH_*_FILE to
    # the container paths, for example DONOR_WALLET_GOOGLE_KEY_FILE=/run/secrets/wallet/google.json.
    # volumes:
    #   - /etc/dad/wallet:/run/secrets/wallet:ro
    ports: ["127.0.0.1:${API_PORT:-8002}:8002"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8002/health/live]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [default, app]
    restart: unless-stopped

  migrate:
    <<: *donor
    command: [migrate]
    profiles: [maintenance]
    environment:
      DONOR_GO_DATABASE_URL: ${DONOR_GO_DATABASE_URL:?set DONOR_GO_DATABASE_URL}

  provision:
    <<: *donor
    command: [provision]
    profiles: [maintenance]
    environment:
      DONOR_GO_DATABASE_URL: ${DONOR_GO_DATABASE_URL:?set DONOR_GO_DATABASE_URL}
      DONOR_API_DATABASE_URL: ${DONOR_API_DATABASE_URL:?set DONOR_API_DATABASE_URL}
      DONOR_WORKER_STRIPE_DATABASE_URL: ${DONOR_WORKER_STRIPE_DATABASE_URL:?set DONOR_WORKER_STRIPE_DATABASE_URL}
      DONOR_WORKER_PROJECTIONS_DATABASE_URL: ${DONOR_WORKER_PROJECTIONS_DATABASE_URL:?set DONOR_WORKER_PROJECTIONS_DATABASE_URL}
      DONOR_WORKER_LOGIN_EMAIL_DATABASE_URL: ${DONOR_WORKER_LOGIN_EMAIL_DATABASE_URL:?set DONOR_WORKER_LOGIN_EMAIL_DATABASE_URL}
      DONOR_WORKER_EMAIL_CHANGES_DATABASE_URL: ${DONOR_WORKER_EMAIL_CHANGES_DATABASE_URL:?set DONOR_WORKER_EMAIL_CHANGES_DATABASE_URL}
      DONOR_WORKER_MESSAGES_DATABASE_URL: ${DONOR_WORKER_MESSAGES_DATABASE_URL:?set DONOR_WORKER_MESSAGES_DATABASE_URL}
      DONOR_WORKER_PUSH_DATABASE_URL: ${DONOR_WORKER_PUSH_DATABASE_URL:?set DONOR_WORKER_PUSH_DATABASE_URL}
      DONOR_MONITOR_DATABASE_URL: ${DONOR_MONITOR_DATABASE_URL:?set DONOR_MONITOR_DATABASE_URL}
      DONOR_STAFF_CLI_DATABASE_URL: ${DONOR_STAFF_CLI_DATABASE_URL:?set DONOR_STAFF_CLI_DATABASE_URL}
      DONOR_REKEY_DATABASE_URL: ${DONOR_REKEY_DATABASE_URL:?set DONOR_REKEY_DATABASE_URL}
      DONOR_RECONCILE_DATABASE_URL: ${DONOR_RECONCILE_DATABASE_URL:?set DONOR_RECONCILE_DATABASE_URL}

  monitor:
    <<: *donor
    command: [monitor]
    profiles: [maintenance]
    environment:
      DONOR_MONITOR_DATABASE_URL: ${DONOR_MONITOR_DATABASE_URL:?set DONOR_MONITOR_DATABASE_URL}

  # Daily read-only reconciliation of Stripe charges and refunds against the
  # database. Only Stripe-reading processes receive STRIPE_SECRET_KEY.
  reconcile:
    <<: *donor
    command: [reconcile]
    profiles: [maintenance]
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY-}
      DONOR_STRIPE_REQUESTS_PER_SECOND: ${DONOR_STRIPE_REQUESTS_PER_SECOND:-25}
      DONOR_RECONCILE_DATABASE_URL: ${DONOR_RECONCILE_DATABASE_URL:?set DONOR_RECONCILE_DATABASE_URL}

  staff:
    <<: *donor
    command: [staff]
    profiles: [maintenance]
    environment:
      DONOR_STAFF_ORIGIN: ${DONOR_STAFF_ORIGIN:?set DONOR_STAFF_ORIGIN}
      DONOR_STAFF_CLI_DATABASE_URL: ${DONOR_STAFF_CLI_DATABASE_URL:?set DONOR_STAFF_CLI_DATABASE_URL}

  rekey:
    <<: *donor
    command: [rekey]
    profiles: [maintenance]
    environment:
      DONOR_EMAIL_ENCRYPTION_KEY: ${DONOR_EMAIL_ENCRYPTION_KEY-}
      DONOR_CONTENT_ENCRYPTION_KEY: ${DONOR_CONTENT_ENCRYPTION_KEY-}
      DONOR_REKEY_DATABASE_URL: ${DONOR_REKEY_DATABASE_URL:?set DONOR_REKEY_DATABASE_URL}

  stripe-worker:
    <<: *donor
    command: [worker, --kind, stripe]
    profiles: [workers]
    environment:
      <<: *worker-environment
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY-}
      DONOR_STRIPE_REQUESTS_PER_SECOND: ${DONOR_STRIPE_REQUESTS_PER_SECOND:-25}
      DONOR_WORKER_STRIPE_DATABASE_URL: ${DONOR_WORKER_STRIPE_DATABASE_URL:?set DONOR_WORKER_STRIPE_DATABASE_URL}
    restart: unless-stopped

  projection-worker:
    <<: *donor
    command: [worker, --kind, projections]
    profiles: [workers]
    environment:
      <<: *worker-environment
      DONOR_WORKER_PROJECTIONS_DATABASE_URL: ${DONOR_WORKER_PROJECTIONS_DATABASE_URL:?set DONOR_WORKER_PROJECTIONS_DATABASE_URL}
    restart: unless-stopped

  login-email-worker:
    <<: *donor
    command: [worker, --kind, login-email]
    profiles: [workers]
    environment:
      <<: [*worker-environment, *mail-transport]
      DONOR_PUBLIC_ORIGIN: ${DONOR_PUBLIC_ORIGIN:?set DONOR_PUBLIC_ORIGIN}
      DONOR_WORKER_LOGIN_EMAIL_DATABASE_URL: ${DONOR_WORKER_LOGIN_EMAIL_DATABASE_URL:?set DONOR_WORKER_LOGIN_EMAIL_DATABASE_URL}
    restart: unless-stopped

  message-worker:
    <<: *donor
    command: [worker, --kind, messages]
    profiles: [workers]
    environment:
      <<: [*worker-environment, *mail-transport]
      DONOR_PUBLIC_ORIGIN: ${DONOR_PUBLIC_ORIGIN:?set DONOR_PUBLIC_ORIGIN}
      DONOR_WORKER_MESSAGES_DATABASE_URL: ${DONOR_WORKER_MESSAGES_DATABASE_URL:?set DONOR_WORKER_MESSAGES_DATABASE_URL}
    restart: unless-stopped

  email-change-worker:
    <<: *donor
    command: [worker, --kind, email-changes]
    profiles: [workers]
    environment:
      <<: [*worker-environment, *mail-transport]
      DONOR_PUBLIC_ORIGIN: ${DONOR_PUBLIC_ORIGIN:?set DONOR_PUBLIC_ORIGIN}
      DONOR_WORKER_EMAIL_CHANGES_DATABASE_URL: ${DONOR_WORKER_EMAIL_CHANGES_DATABASE_URL:?set DONOR_WORKER_EMAIL_CHANGES_DATABASE_URL}
    restart: unless-stopped

  # Push provider keys stay outside the image, like the API's Wallet keys: mount them
  # read-only and set DONOR_PUSH_APNS_KEY_FILE and DONOR_PUSH_FCM_KEY_FILE to the
  # container paths. The API receives platform names, never these credentials.
  push-worker:
    <<: *donor
    command: [worker, --kind, push]
    profiles: [workers]
    environment:
      <<: [*worker-environment, *push-delivery]
      DONOR_WORKER_PUSH_DATABASE_URL: ${DONOR_WORKER_PUSH_DATABASE_URL:?set DONOR_WORKER_PUSH_DATABASE_URL}
    # volumes:
    #   - /etc/dad/push:/run/secrets/push:ro
    restart: unless-stopped

  web:
    image: ${IMAGE_PREFIX:-dad}/web:${IMAGE_TAG:?set IMAGE_TAG}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        DONOR_PUBLIC_ORIGIN: ${DONOR_PUBLIC_ORIGIN:?set DONOR_PUBLIC_ORIGIN}
        DONOR_STAFF_ORIGIN: ${DONOR_STAFF_ORIGIN:?set DONOR_STAFF_ORIGIN}
        DONOR_IOS_APP_ID: ${DONOR_IOS_APP_ID-}
        DONOR_ANDROID_APP_PACKAGE: ${DONOR_ANDROID_APP_PACKAGE-}
        DONOR_ANDROID_APP_CERT_SHA256: ${DONOR_ANDROID_APP_CERT_SHA256-}
    environment:
      DONOR_API_BASE_URL: http://api:8002
      # nginx overwrites this header with the client address on every request. No host
      # port is published: a local process could otherwise set it to any address.
      DONOR_CLIENT_IP_HEADER: ${DONOR_CLIENT_IP_HEADER-X-Real-IP}
    depends_on:
      api:
        condition: service_healthy
    # One Node.js process renders on one core; run one replica per core to spare.
    deploy:
      replicas: ${WEB_REPLICAS:-1}
    networks: [app, edge]
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  # The only service with public ports. It reaches the web service alone, over the edge
  # network; the API and database stay on the default network.
  nginx:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    user: "101:101"
    environment:
      INGRESS_MODE: ${INGRESS_MODE:-cloudflare}
      DONOR_PUBLIC_ORIGIN: ${DONOR_PUBLIC_ORIGIN:?set DONOR_PUBLIC_ORIGIN}
      DONOR_STAFF_ORIGIN: ${DONOR_STAFF_ORIGIN:?set DONOR_STAFF_ORIGIN}
      NGINX_ENVSUBST_FILTER: ^INGRESS_
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/05-ingress.envsh:/docker-entrypoint.d/05-ingress.envsh:ro
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/nginx/conf:/etc/nginx/ingress:ro
      # fullchain.pem and privkey.pem, readable by uid 101.
      - ${INGRESS_TLS_DIR:-/etc/dad/tls}:/etc/nginx/tls:ro
      - ${INGRESS_ORIGIN_PULL_CA:-./deploy/nginx/cloudflare-origin-pull-ca.pem}:/etc/nginx/origin-pull-ca.pem:ro
      - ${INGRESS_STAFF_ACCESS:-./deploy/nginx/staff-access.conf}:/etc/nginx/staff-access.conf:ro
    tmpfs:
      - /tmp:size=64m,uid=101,gid=101,mode=0700
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101,mode=0700
    ports: ["80:8080", "443:8443"]
    # Set by scripts/deploy.sh; a change makes Compose recreate the container.
    labels:
      org.dad.ingress-config: ${INGRESS_CONFIG_HASH:-}
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
    ulimits:
      nofile: 65536
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/health]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  # IPv6 lets published ports deliver IPv6 clients with their own addresses; without it,
  # Docker's proxy presents them all as the gateway, sharing one rate-limit quota.
  edge:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd42:dad:ed9e::/64
  default:
    ipam:
      config:
        - subnet: 172.30.42.0/24
  # Web proxies to the API, and nothing else, so its subnet is the API's trusted proxies.
  app:
    internal: true
    ipam:
      config:
        - subnet: 172.30.43.0/24

volumes:
  postgres-data:
